name: out_split_in
description: "A smart personal expense tracker with auto-detection."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.5.0
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  firebase_core: ^4.15.0
  dio: ^5.11.1
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  freezed_annotation: ^3.1.0
  intl: ^0.20.2
  notification_listener_service: ^1.0.0
  crypto: ^3.0.7
  get_it: ^9.3.0
  loading_animation_widget: ^1.3.0
  android_id: ^0.5.2+1
  permission_handler: ^12.0.1
  fl_chart: ^1.3.0
  shared_preferences: ^2.5.5
  smooth_page_indicator: ^3.0.0
  connectivity_plus: ^7.3.2
  google_sign_in: 6.2.2
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  archive: ^4.0.10


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon2.png"
  min_sdk_android: 21
  adaptive_icon_background: "#087F59"
  adaptive_icon_foreground: "assets/icon/icon2.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
